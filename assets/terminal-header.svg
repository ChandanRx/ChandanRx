<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>
  <style>
    .terminal-window { fill: url(#bgGrad); stroke: #303030; stroke-width: 1.5; rx: 10px; }
    .terminal-bar { fill: #1C1C1C; stroke: #303030; stroke-width: 1; }
    .term-title { fill: #A3A3A3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 500; }
    .prompt-sym { fill: #FFD43B; font-weight: bold; }
    .code-text { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", monospace; font-size: 14px; }
    .kw { fill: #FFD43B; font-weight: 600; }
    .var { fill: #F5F5F5; }
    .str { fill: #FACC15; }
    .comment { fill: #737373; font-style: italic; }
    .cursor {
      fill: #FFD43B;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Window Container -->
  <rect x="1" y="1" width="818" height="198" rx="10" class="terminal-window" />
  
  <!-- Title Bar -->
  <path d="M 1 11 A 10 10 0 0 1 11 1 L 809 1 A 10 10 0 0 1 819 11 L 819 32 L 1 32 Z" class="terminal-bar" />
  
  <!-- Traffic Light Dots -->
  <circle cx="20" cy="16" r="5" fill="#FF5F56" />
  <circle cx="36" cy="16" r="5" fill="#FFBD2E" />
  <circle cx="52" cy="16" r="5" fill="#27C93F" />
  
  <!-- Title -->
  <text x="410" y="20" text-anchor="middle" class="term-title">chandan@rxn-dev: ~/profile (zsh)</text>
  
  <!-- Terminal Content -->
  <g transform="translate(24, 60)" class="code-text">
    <!-- Line 1 -->
    <text x="0" y="0">
      <tspan class="prompt-sym">➜ </tspan>
      <tspan class="kw">const </tspan>
      <tspan class="var">developer </tspan>
      <tspan fill="#A3A3A3">= </tspan>
      <tspan class="str">"Chandan Pargi"</tspan><tspan fill="#A3A3A3">;</tspan>
    </text>
    
    <!-- Line 2 -->
    <text x="0" y="30">
      <tspan class="prompt-sym">➜ </tspan>
      <tspan class="kw">const </tspan>
      <tspan class="var">role </tspan>
      <tspan fill="#A3A3A3">= </tspan>
      <tspan class="str">"Fullstack &amp; MERN Stack Developer"</tspan><tspan fill="#A3A3A3">;</tspan>
    </text>
    
    <!-- Line 3 -->
    <text x="0" y="60">
      <tspan class="prompt-sym">➜ </tspan>
      <tspan class="kw">const </tspan>
      <tspan class="var">coreTech </tspan>
      <tspan fill="#A3A3A3">= [ </tspan>
      <tspan class="str">"React.js"</tspan><tspan fill="#A3A3A3">, </tspan>
      <tspan class="str">"Next.js"</tspan><tspan fill="#A3A3A3">, </tspan>
      <tspan class="str">"Node.js"</tspan><tspan fill="#A3A3A3">, </tspan>
      <tspan class="str">"NestJS"</tspan><tspan fill="#A3A3A3">, </tspan>
      <tspan class="str">"TypeScript"</tspan><tspan fill="#A3A3A3">, </tspan>
      <tspan class="str">"PostgreSQL"</tspan>
      <tspan fill="#A3A3A3"> ];</tspan>
    </text>
    
    <!-- Line 4 -->
    <text x="0" y="90">
      <tspan class="prompt-sym">➜ </tspan>
      <tspan class="kw">const </tspan>
      <tspan class="var">mission </tspan>
      <tspan fill="#A3A3A3">= </tspan>
      <tspan class="str">"Building scalable real-time platforms &amp; modern digital web apps"</tspan><tspan fill="#A3A3A3">;</tspan>
      <tspan class="cursor"> █</tspan>
    </text>
  </g>
</svg>